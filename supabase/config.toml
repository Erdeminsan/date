project_id = "playmatch"

[functions.delete-account]
# The handler verifies the bearer with Auth getUser, then reauthenticates with
# the owner's password. Gateway verification is disabled for signing-key compatibility.
verify_jwt = false

[functions.report-photo]
# The handler authenticates via getUser before any privileged RPC/download.
verify_jwt = false

[functions.finish-round]
verify_jwt = false

[functions.process-game-result]
# Authenticated by a private, expiring per-delivery capability through a service-only RPC.
verify_jwt = false
